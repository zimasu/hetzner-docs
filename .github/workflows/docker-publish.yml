name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zimasu/docs:latest
            ghcr.io/zimasu/docs:${{ github.sha }}

  update-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout hetzner-gitops
        uses: actions/checkout@v4
        with:
          repository: zimasu/hetzner-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update image tag
        run: |
          sed -i "s|image: ghcr.io/zimasu/docs:.*|image: ghcr.io/zimasu/docs:${{ github.sha }}|" manifests/mkdocs/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifests/mkdocs/deployment.yaml
          git commit -m "chore: update mkdocs image to ${{ github.sha }}"
          git push
